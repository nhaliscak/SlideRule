name: Property data correction or addition
description: A datapack value (material or fluid) is wrong, or a missing one should be added
labels: ["data"]
body:
  - type: input
    id: record
    attributes: { label: Pack, record and property, description: "e.g. `nist-cryo / 304-stainless / thermal_conductivity`." }
    validations: { required: true }
  - type: textarea
    id: value
    attributes: { label: Value shown and value you propose, description: "With units and, for a curve, the temperature." }
    validations: { required: true }
  - type: textarea
    id: source
    attributes:
      label: Source
      description: "A citation (author, title, edition, table or URL, access date). It must be a source whose data may be redistributed (public-domain, openly licensed, a published formula, or a physical fact). Do not paste copyrighted tables."
    validations: { required: true }
