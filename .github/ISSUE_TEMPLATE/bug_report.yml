name: Bug
description: Something crashes, hangs, looks wrong or does not work as described
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What you did and what you saw (a screenshot or the error text helps)." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
    validations: { required: true }
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: ["Web version (GitHub Pages)", "Local install, web UI", "Command line", "Python API", "LiveCalc", "System canvas"]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version and Python, description: "`sliderule --version` or the commit; Python version for a local install." }
